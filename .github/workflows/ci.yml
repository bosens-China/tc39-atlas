name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22.14'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore Rspack persistent cache
        uses: actions/cache@v4
        with:
          path: apps/web/node_modules/.cache/rspack
          key: rspack-${{ runner.os }}-node-22-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            rspack-${{ runner.os }}-node-22-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm check
      - run: pnpm build
