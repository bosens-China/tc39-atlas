name: Publish GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'apps/web/**'
      - 'packages/core/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  schedule:
    # 每天北京时间 04:00（UTC 前一天 20:00）
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22.14'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore Rspack persistent cache
        uses: actions/cache@v4
        with:
          path: apps/web/node_modules/.cache/rspack
          # CI 使用根路径构建，Pages 缓存必须隔离，避免复用错误的客户端 base。
          key: rspack-pages-${{ github.event.repository.name }}-${{ runner.os }}-node-22-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            rspack-pages-${{ github.event.repository.name }}-${{ runner.os }}-node-22-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Run repository quality checks
        run: pnpm check

      - name: Scan upstream translation work
        run: pnpm sync:scan
        env:
          PREVIOUS_DATASET_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/dataset.json

      - name: Translate and generate the versioned dataset
        run: pnpm sync:translate
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TRANSLATION_BASE_URL: ${{ vars.TRANSLATION_BASE_URL }}
          TRANSLATION_MODEL: ${{ vars.TRANSLATION_MODEL }}
          TRANSLATION_MAX_OUTPUT_TOKENS: ${{ vars.TRANSLATION_MAX_OUTPUT_TOKENS }}

      - name: Build the website
        run: pnpm --filter @tc39-atlas/web build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Verify the client-side Pages base path
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          if grep --fixed-strings --quiet "base:\"${BASE_PATH}\"" apps/web/doc_build/static/js/index.*.js; then
            exit 0
          fi
          echo "::error::The client bundle does not contain the expected Pages base path: ${BASE_PATH}"
          exit 1

      - name: Persist the generated dataset
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- apps/web/docs/public/data/dataset.json apps/web/docs/public/data/manifest.json; then
            echo "Generated dataset is unchanged; skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/docs/public/data/dataset.json apps/web/docs/public/data/manifest.json
          git commit -m "chore(data): refresh generated dataset [skip ci]"
          git push origin HEAD:main

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/doc_build

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
