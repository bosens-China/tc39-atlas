name: Publish GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'apps/web/**'
      - 'packages/core/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  schedule:
    # 每天北京时间 04:00（UTC 前一天 20:00）
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    outputs:
      should_deploy: ${{ steps.release.outputs.should_deploy }}
    permissions:
      contents: write
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22.14'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run repository quality checks
        run: pnpm check

      - name: Scan upstream translation work
        run: pnpm sync:scan
        env:
          PREVIOUS_DATASET_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/dataset.json

      - name: Translate and generate the versioned dataset
        run: pnpm sync:translate
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TRANSLATION_BASE_URL: ${{ vars.TRANSLATION_BASE_URL }}
          TRANSLATION_MODEL: ${{ vars.TRANSLATION_MODEL }}
          TRANSLATION_MAX_OUTPUT_TOKENS: ${{ vars.TRANSLATION_MAX_OUTPUT_TOKENS }}

      - name: Decide whether to publish
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if git diff --quiet -- apps/web/docs/public/data/dataset.json apps/web/docs/public/data/manifest.json; then
            data_changed=false
          else
            data_changed=true
          fi
          if [[ "$EVENT_NAME" == "schedule" && "$data_changed" == "false" ]]; then
            should_deploy=false
          else
            should_deploy=true
          fi
          echo "data_changed=$data_changed" >> "$GITHUB_OUTPUT"
          echo "should_deploy=$should_deploy" >> "$GITHUB_OUTPUT"

      - name: Build the website
        if: steps.release.outputs.should_deploy == 'true'
        run: pnpm --filter @tc39-atlas/web build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Persist the generated dataset
        if: steps.release.outputs.should_deploy == 'true' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- apps/web/docs/public/data/dataset.json apps/web/docs/public/data/manifest.json; then
            echo "Generated dataset is unchanged; skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/docs/public/data/dataset.json apps/web/docs/public/data/manifest.json
          git commit -m "chore(data): refresh generated dataset [skip ci]"
          git push origin HEAD:main

      - if: steps.release.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v5
      - if: steps.release.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/doc_build

  deploy:
    if: needs.build.outputs.should_deploy == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
