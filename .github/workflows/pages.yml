name: Publish GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'apps/web/**'
      - 'packages/core/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22.14'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore Rspack persistent cache
        uses: actions/cache@v4
        with:
          path: apps/web/node_modules/.cache/rspack
          key: rspack-${{ runner.os }}-node-22-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            rspack-${{ runner.os }}-node-22-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Run repository quality checks
        run: pnpm check

      - name: Generate the versioned dataset
        run: pnpm sync
        env:
          PREVIOUS_DATASET_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/dataset.json
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TRANSLATION_BASE_URL: ${{ vars.TRANSLATION_BASE_URL }}
          TRANSLATION_MODEL: ${{ vars.TRANSLATION_MODEL }}
          TRANSLATION_MAX_OUTPUT_TOKENS: ${{ vars.TRANSLATION_MAX_OUTPUT_TOKENS }}

      - name: Build the website
        run: pnpm --filter @tc39-atlas/web build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/doc_build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
