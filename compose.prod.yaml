services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tc39_atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tc39_atlas}
      POSTGRES_USER: ${POSTGRES_USER:-tc39_atlas}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-tc39_atlas} -d ${POSTGRES_DB:-tc39_atlas}',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    volumes:
      - tc39_atlas_pg_data:/var/lib/postgresql/data

  mcp:
    build:
      context: .
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: postgres://${POSTGRES_USER:-tc39_atlas}:${POSTGRES_PASSWORD:-tc39_atlas}@postgres:5432/${POSTGRES_DB:-tc39_atlas}
      HOST: 0.0.0.0
      PORT: 43127
      SYNC_ON_START: ${SYNC_ON_START:-true}
      TRANSLATION_API_KEY: ${TRANSLATION_API_KEY:-}
      TRANSLATION_BASE_URL: ${TRANSLATION_BASE_URL:-}
      TRANSLATION_BATCH_SIZE: ${TRANSLATION_BATCH_SIZE:-100}
      TRANSLATION_CONCURRENCY: ${TRANSLATION_CONCURRENCY:-100}
      TRANSLATION_MAX_ITEMS: ${TRANSLATION_MAX_ITEMS:-}
      TRANSLATION_MODEL: ${TRANSLATION_MODEL:-gpt-5.6-luna}
    expose:
      - '43127'
    restart: unless-stopped

  web:
    build:
      context: .
      target: web-runtime
    depends_on:
      mcp:
        condition: service_healthy
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:80'
    restart: unless-stopped

volumes:
  tc39_atlas_pg_data:
